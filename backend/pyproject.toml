[tool.poetry]
name = "legaldoc-intelligence-backend"
version = "0.1.0"
description = "LegalDoc Intelligence Platform - AI-powered affidavit generation and validation"
authors = ["LegalDoc Team"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
python-multipart = "^0.0.9"
openai = "^1.35.0"
anthropic = "^0.28.0"
google-generativeai = "^0.7.0"
aiofiles = "^23.2.1"
structlog = "^24.2.0"
rich = "^13.7.1"
tenacity = "^8.3.0"
redis = "^5.0.7"
arq = "^0.26.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
faker = "^25.8.0"
black = "^24.4.2"
ruff = "^0.4.10"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
